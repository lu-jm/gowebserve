version: '3.8'

services:
  # 你的 Go 服务
  my-go-app:
    build:
      context: .  # 指定 Dockerfile 所在的上下文目录，通常为当前目录
      dockerfile: Dockerfile  # 明确指定 Dockerfile 文件名
    image: my-go-app:latest  # 指定构建后的镜像名称和标签
    container_name: my-go-app-container  # 为容器指定一个名字，便于管理
    restart: unless-stopped  # 设置容器重启策略，除非手动停止，否则总是重启
    ports:
      - "8080:8080"  # 将宿主机的 8080 端口映射到容器的 8080 端口 (HOST:CONTAINER)
    # environment:
    #   - ENV_VAR_NAME=value  # 设置环境变量，例如数据库连接字符串等
    #   - PORT=8080  # 如果你的 Go 应用通过环境变量指定端口，请确保与 EXPOSE 一致
    # volumes:
    #   - ./config:/app/config  # 如果需要挂载配置文件或数据卷，可以取消注释并修改
    depends_on:
      - mysql  # 确保 MySQL 先启动
  # MySQL 服务
  mysql:
    image: amd64/mysql:latest
    container_name: mysql
    restart: unless-stopped
    ports:
      - "3306:3306"  # 暴露 MySQL 端口到宿主机（可选）
    environment:
      MYSQL_ROOT_PASSWORD: 13789376  # 设置 root 密码
      MYSQL_DATABASE: mydatabase      # 容器启动时自动创建的数据库